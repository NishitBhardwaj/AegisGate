services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped

    environment:
      POSTGRES_USER: aegisgate
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB: aegisgate

    ports:
      - "127.0.0.1:55432:5432"

    volumes:
      - aegisgate_pgdata:/var/lib/postgresql/data

    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U aegisgate -d aegisgate
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  aegisgate_pgdata:
